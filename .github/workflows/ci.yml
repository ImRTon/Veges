name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Build and verify
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Verify, test, lint, and package
        run: >-
          ./gradlew --no-daemon --dependency-verification=strict
          verifyFormatting staticAnalysis test :app:validateReleaseArtifact

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: veges-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

  instrumented:
    name: Instrumented tests
    runs-on: macos-14
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Run emulator tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          script: ./gradlew --no-daemon --dependency-verification=strict connectedDebugAndroidTest
